[versions]
# Plugins
aboutlibraries = "15.2.0"
androidGradle = "9.2.1"
coilCompose = "3.4.0"
coreSplashscreen = "1.2.0"
documentFile = "1.1.0"
kotlin = "2.4.10"
serializationPlugin = "2.4.10"
ksp = "2.3.2"
okio = "3.18.1"
# Dependencies
coreKtx = "1.19.0"
appcompat = "1.7.1"
coroutinesAndroid = "1.11.0"
activity = "1.13.0"
fragment = "1.8.9"
lifecycleViewModelKtx = "2.11.0"
lifecycleRuntimeKtx = "2.11.0"
lifecycleLiveDataKtx = "2.11.0"
roomRuntime = "2.8.4"
roomCompiler = "2.8.4"
navigation3 = "1.1.5"
sonner = "0.4.0"
workRuntimeKtx = "2.11.2"
datastorePreferences = "1.2.1"
datetime = "0.8.0"
serialization = "1.11.0"
jsoup = "1.23.1"
retrofit = "3.0.0"
converterSerialization = "1.0.0"
coil = "2.7.0"
okhttp = "5.3.2"
testJunit = "1.3.0"
guava = "33.6.0-android"
exoplayer = "1.10.1"
desugarJdkLibs = "2.1.5"
composeBom = "2026.06.01"
compose-material3 = "1.5.0-alpha25"
mpv = "v0.1.7"
m3color = "2026.1"

# ---- Kotlin Multiplatform / Compose Multiplatform ----
# 版本对齐约束：CMP 与 Kotlin 强绑定，Kotlin 2.4.10 <-> CMP 1.12.0
composeMultiplatform = "1.12.0"
# JetBrains 的 material3 移植未跟随主版本（CMP 1.12.0 插件内置即为 1.9.0，见 ComposePlugin$Dependencies）
composeMultiplatformMaterial3 = "1.12.0-alpha03"
# JetBrains 维护的 AndroidX 跨平台移植（导航 / 生命周期）
jetbrainsNavigation3 = "1.1.1"
jetbrainsLifecycle = "2.11.0"
# 数据与网络
ktor = "3.5.2"
sqliteBundled = "2.7.0"
# Coil 3.4.0 内置的 skiko 与 CMP 1.12 不对齐，共享模块单独用新版本；:app 对齐时机见规划文档 P6
coil3Kmp = "3.6.1"

# P4：ksoup 坐标切换（原 com.mohamedrejeb.ksoup:ksoup-html 仅 SAX、无 DOM/select；
# 具 jsoup 兼容 API 的坐标是 Fleeksoft 系，P3a 桌面实跑验证过）
fleeksoft-ksoup = "0.2.6"
# M3：桌面 mpv 引擎（animeko 同款；engine + Skia 渲染 + 各 OS native 一体，
# 仅 desktopMain 依赖，不碰 android/ios）
mediamp = "0.3.2"
# M5-5：CF 验证多端 WebView（iOS=WKWebView 封装，desktop=KCEF/Chromium 内嵌封装；
# 桌面运行时需按该库 README.desktop.md 初始化 KCEF natives）
compose-webview-multiplatform = "2.0.3"

[libraries]
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
# 构建期依赖（仅供 build-logic 的 convention plugin 编译时使用）
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradle" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# KMP 共享层用的协程核心（:app 目前用的是 coroutines-android）
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutinesAndroid" }
# Android
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutinesAndroid" }
# Jetpack
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewModelKtx" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModelKtx" }
lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewModelKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycle-livedata-core = { group = "androidx.lifecycle", name = "lifecycle-livedata-core", version.ref = "lifecycleLiveDataKtx" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
sonner = { module = "io.github.dokar3:sonner", version.ref = "sonner" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
# DataStore KMP：core 版本是多平台产物（commonMain 可用），Android 专属的 SharedPreferences 迁移仍在上面的 datastore-preferences 里
datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastorePreferences" }
# Compose
compose-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
compose-material3 = { group = "androidx.compose.material3", name = "material3",version.ref = "compose-material3" }
compose-ui-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
kyant-m3color = { group = "com.github.Kyant0", name = "m3color", version.ref = "m3color" }
# Parse
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "converterSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-dns-over-https = { group = "com.squareup.okhttp3", name = "okhttp-dnsoverhttps", version.ref = "okhttp" }

# Pic
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
# Test
test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testJunit" } # androidTestImplementation

# video
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoplayer" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "exoplayer" }
mpv-lib = { group = "com.github.abdallahmehiz", name = "mpv-android", version.ref = "mpv" }

# Other
datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }

androidx-ui = { group = "androidx.compose.ui", name = "ui" }

# ---- KMP / Compose Multiplatform ----
# 导航 3：JetBrains 移植版 navigation3-ui 提供全平台 NavDisplay；
# runtime 为 Google 原版且本身已是 KMP，需显式声明以在 commonMain 中拿到 NavKey / SavedStateConfiguration
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jetbrainsNavigation3" }
# 注意：与 :app 使用的 androidx-navigation3-runtime(1.1.5) 区分开，
# 这里必须跟 JetBrains nav3-ui 1.1.1 的 POM 声明对齐，否则 ABI 不匹配
navigation3-runtime-cmp = { module = "androidx.navigation3:navigation3-runtime", version.ref = "jetbrainsNavigation3" }
jetbrains-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }

# Compose Multiplatform 运行时依赖（CMP 1.12 起不再支持 compose.runtime 简写，需显式声明）
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }

# 网络：Ktor 取代 Retrofit + OkHttp
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# 解析：ksoup 取代 jsoup（P4 起用 Fleeksoft 坐标，见 versions.fleeksoft-ksoup）
ksoup = { group = "com.fleeksoft.ksoup", name = "ksoup", version.ref = "fleeksoft-ksoup" }

# M5-5：CF 验证多端 WebView（KMP 坐标，各端变体自动解析）
compose-webview-multiplatform = { module = "io.github.kevinnzou:compose-webview-multiplatform", version.ref = "compose-webview-multiplatform" }

# 数据库：Room 多平台 + 自带 SQLite 驱动
room-runtime-kmp = { module = "androidx.room:room-runtime", version.ref = "roomRuntime" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqliteBundled" }

# 图片：Coil 3 本就多平台，网络层换用 ktor3 实现
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3Kmp" }
coil-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil3Kmp" }
# P6d-2：getchu 特化加载器走 OkHttp（jvmMain 专用，与 core 同版本 3.6.1）
coil-network-okhttp-kmp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3Kmp" }

# M3：桌面 mpv 引擎（含 Skia 渲染面 + 各 OS native；仅 desktopMain 用）
mediamp-mpv-desktop = { module = "org.openani.mediamp:mediamp-mpv-desktop", version.ref = "mediamp" }
# M3：mpv 各 OS 原生库（engine 在运行时按平台解包加载；runtimeOnly 即可）
mediamp-mpv-runtime = { module = "org.openani.mediamp:mediamp-mpv-runtime", version.ref = "mediamp" }

[bundles]

android-base = [
    "core-ktx",
    "appcompat",
    "coroutines-android"
]

android-jetpack = [
    "lifecycle-viewmodel-ktx", "lifecycle-runtime-ktx", "lifecycle-livedata-core",
    "activity-ktx", "fragment",
    "room-runtime",
    "work-runtime-ktx", "guava"
]

[plugins]
com-android-application = { id = "com.android.application", version.ref = "androidGradle" }
com-google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
org-jetbrains-kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "serializationPlugin" }
org-jetbrains-kotlin-plugin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# KMP / Compose Multiplatform 插件
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# AGP 9 起，KMP 库模块必须用这个插件；旧的 com.android.library 与 KMP 插件互斥
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }
# Room 官方 Gradle 插件：负责把 KSP 代码生成接进每个 KMP target（version 与 room-runtime 对齐）
androidx-room = { id = "androidx.room", version.ref = "roomRuntime" }
