name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 文档引用校验：docs/ 与 AGENTS.md/README.md 里的每个 `文件:行号` 都必须还存在，
  # 取证条目必须四件套齐全，docs/plan/ 只允许一份活计划。断链 = 直接失败。
  docs:
    name: Doc citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check document citations
        run: python tools/check_doc_citations.py

      # 临时探针（查完即撤）：jvm-android 任务在 runner 上报 KSP 插件 marker
      # "was not found in any of the following sources"，而同一制品在本机冷缓存下能解析。
      # 这里从 runner 侧直接打四个仓库的 marker URL，判断是"runner 到不了"还是"Gradle 找不到"。
      - name: TEMP probe plugin repositories
        run: |
          for u in \
            "https://maven.aliyun.com/repository/gradle-plugin/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
            "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
            "https://dl.google.com/dl/android/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
            "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
          ; do
            printf '%-24s ' "$(echo "$u" | cut -d/ -f3)"
            curl -sS -o /dev/null -w 'code=%{http_code} t=%{time_total}s\n' --max-time 25 "$u" || echo "curl FAILED"
          done

  # Windows runner：desktopTest 里的 skiko runtimeOnly 钉的是 windows-x64 原生库，
  # 换 Linux runner 会因原生库不匹配导致 Skia 相关测试失败。
  jvm-android:
    name: Build (Android + Desktop) & desktopTest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 全模块 compileSdk 统一到 android-37（:shared 与 :app 同一套平台，只装 37）。
      # :app targetSdk 有意降到 36（退出 Android 17 行为变更），但 targetSdk 不需要装对应平台。
      # API 37 起平台带 minor 版本（目录名 android-37.0），包名可能是 android-37 也可能是
      # android-37.0 → 两个都试。
      # ⚠️ 刻意不用 `|| true` 吞失败：装不上平台要在本步说清楚，而非留到下游编译期。
      - name: Install Android platform (37)
        shell: bash
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for pkg in "platforms;android-37" "platforms;android-37.0" "build-tools;37.0.0"; do
            if yes | "$SM" "$pkg" >/dev/null 2>&1; then
              echo "ok    $pkg"
            else
              echo "note  $pkg 不可用或已安装"
            fi
          done

      # 装完断言：失败在"平台缺失"这一步说清楚，而不是留到编译期。
      - name: Assert required SDK platform is present
        shell: bash
        run: |
          echo "installed platforms:"; ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms" | grep -q '^android-37' || {
            echo "::error::缺少 android-37(.x)（:app 与 :shared 的 compileSdk 都需要）"; exit 1; }
          echo "platforms OK"

      - name: Compile Android + Desktop
        # 视频各层都是独立模块，显式编译（project 依赖也会间接触发，这里写明防漏）。
        run: ./gradlew :video:contract:compileAndroidMain :video:contract:compileKotlinDesktop :video:engine:compileAndroidMain :video:engine:compileKotlinDesktop :video:ui:compileAndroidMain :video:ui:compileKotlinDesktop :video:surface:compileAndroidMain :video:surface:compileKotlinDesktop :shared:compileAndroidMain :shared:compileKotlinDesktop :app:compileDebugKotlin :desktopApp:compileKotlin --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: desktopTest
        # 纯逻辑测试随代码进各视频模块 / :video:contract（commonTest 经 desktop 跑），逐一都跑。
        run: ./gradlew :video:contract:desktopTest :video:engine:desktopTest :video:ui:desktopTest :shared:desktopTest --console=plain

      - name: Android host unit tests
        # commonTest 在 Android host（JVM，无需模拟器）再跑一遍——
        # 覆盖 assets 管线等平台 actual 与桌面不同的路径。
        run: ./gradlew :video:contract:testAndroidHostTest :video:engine:testAndroidHostTest :video:ui:testAndroidHostTest :shared:testAndroidHostTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: |
            video/contract/build/test-results/desktopTest/
            video/engine/build/test-results/desktopTest/
            video/ui/build/test-results/desktopTest/
            shared/build/test-results/desktopTest/
          if-no-files-found: ignore

  # macOS runner：Kotlin/Native 编译 iOS 目标——这是 Windows 上无法验证的部分，
  # iosMain 的所有代码（备份 I/O / CF WebView / 裁剪 Skia 管线）由此自动把关。
  ios-compile:
    name: Compile iOS (Kotlin/Native)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile iOS (device + simulator)
        # 视频各层都含 iosMain（引擎/LogUtil/时钟/渲染面），与 :shared 同编。
        run: ./gradlew :video:engine:compileKotlinIosArm64 :video:engine:compileKotlinIosSimulatorArm64 :video:ui:compileKotlinIosArm64 :video:ui:compileKotlinIosSimulatorArm64 :video:surface:compileKotlinIosArm64 :video:surface:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --console=plain
