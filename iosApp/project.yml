# Xcode 工程生成配置（xcodegen）
#
# 用法：
#   brew install xcodegen
#   cd iosApp && xcodegen generate
#   open iosApp.xcodeproj
#
# 生成后即可 Xcode 直接 Run 到模拟器/真机；
# 构建时通过脚本阶段先调 Gradle 编译共享框架 :shared（baseName=ComposeApp）。
name: iosApp
options:
  bundleIdPrefix: me.lovehan1me
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Kotlin/Native 只编了 iosArm64/iosSimulatorArm64（无 x86_64 模拟器 slice），
    # 不锁的话 xcodebuild 默认双架构，Gradle 任务会报
    # "Unknown iOS simulator arch: 'x86_64'"
    ARCHS: arm64
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      # ⚠️ 必须在这里声明全部自定义键：xcodegen generate 会**整文件重写** Info.plist，
      #    只写 path 不写 properties 会把已提交的键全部清掉
      #    （实测丢过 UIBackgroundModes / UIFileSharingEnabled，导致画中画与文件访问失效）。
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovehan1me.ios
        PRODUCT_NAME: Han1meViewer
        # Kotlin/Native 共享框架的输出目录（Gradle 按 sdk 与架构落盘）
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/../shared/build/bin"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
    dependencies:
      # xcodegen 不直接支持 Gradle 框架产物，改由脚本阶段产出并手动链接
      - sdk: UIKit.framework
    preBuildScripts:
      # 构建前先编译共享模块框架（Kotlin 1.9.20+ 提供的集成任务）
      - name: Build Shared Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

# 必须显式声明 scheme：不声明则 xcodegen 不产出 .xcscheme，
# 命令行 xcodebuild 会报「Supported platforms for the buildables in the
# current scheme is empty」，任何 -destination 都匹配不上。
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lovehan1me.iosUITests
        # 不显式给 PRODUCT_NAME 的话产物名是空的（-Runner.app / .xctest），
        # xcodegen 顶层 settings 也不会透传到这个 target，以下都得手写：
        PRODUCT_NAME: iosAppUITests
        SDKROOT: iphoneos
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iosApp
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppUITests
